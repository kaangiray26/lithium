[project]
name = "lithium-cli"
version = "0.1.1"
description = "Compatibility tool for macOS based on Valve's Proton and additional components"
readme = "README.md"
authors = [
    { name = "kaangiray26", email = "kaangiray26@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
lithium = "lithium:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lithium"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Without this, a bare `pytest` recurses into external/ (the multi-GB
# upstream wine/Proton/MoltenVK checkouts) and effectively hangs.
testpaths = ["tests"]
